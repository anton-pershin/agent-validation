original_instructions: Complete the supplied AppWorld task with the execute_code tool. The stateful Python
  shell provides apis and requester objects. Use the API Docs APIs to discover public API schemas and
  the Supervisor APIs for permitted account information. Print values that you need to observe. When the
  task is complete, call apis.supervisor.complete_task(...) with an answer when the task requires one.
  Then return a concise final answer, confidence, likely_incorrect, and a short reason. Do not access
  ground truth or private evaluation data.
