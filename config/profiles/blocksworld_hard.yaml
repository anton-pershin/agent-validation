name: blocksworld_hard
solution_module: reliable_agent
random_seed: 0
original_instructions: >-
  Solve the Blocks World task in the supplied PDDL problem. Use the available
  actions and observations. Declare completion only after the goal is satisfied.
  Return a concise answer, confidence, likely_incorrect, and a short reason.
tasks:
  - id: rebuild_01
    problem: ../blocks_world/problems/hard/rebuild_01.pddl
  - id: rebuild_02
    problem: ../blocks_world/problems/hard/rebuild_02.pddl
